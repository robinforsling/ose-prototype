[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ose"
version = "0.1.0"
description = "Open Simulation Environment for autonomous combat aircraft systems"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]
# The table form rather than PEP 639's `license = "Apache-2.0"` string: the
# SPDX form needs setuptools >= 77, and build-system only pins >= 68.
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Disables two ROS pytest11 plugins (launch_testing, launch_ros) that pytest
# auto-discovers whenever a ROS PYTHONPATH is set, even inside this project's
# venv -- they import 'launch', which needs PyYAML, which this project does
# not depend on, and crash collection before any test runs. Harmless to
# disable on machines without ROS: `-p no:X` is a no-op if X was never
# registered.
addopts = "-p no:launch_testing -p no:launch_ros --strict-markers"

# Four categories, and they partition the suite: every test is exactly one.
# The axis is what a FAILURE INDICTS, not how many components a test builds --
# ten of the test files construct two or more, so counting them would put half
# the suite in `integration` and the label would stop meaning anything. See
# ADR 0028 and tests/README.md.
#
# --strict-markers above is deliberate: an unregistered marker is a silent
# no-match, which is the failure mode ADR 0024 exists about.
markers = [
    "unit: a failure indicts one component",
    "integration: a failure indicts a seam between components",
    "behaviour: a failure indicts the platform's emergent behaviour",
    "conformance: a failure indicts the codebase itself, not the simulated system",
    "performance: asserts a SYSTEM performance claim -- accuracy, envelope, endurance. Orthogonal to the four above; not software speed",
    "slow: over about half a second, usually a Monte Carlo ensemble",
]
